personnels et/ou à des fins qui n’entrent pas dans le cadre de leur activité professionnelle, commerciale, libérale, industrielle, artisanale (ci-après\u0026nbsp;: le(s) «\u0026nbsp;Client(s)\u0026nbsp;»), dans le but d’établir une relation privilégiée avec ceux-ci (ci-après : la « Carte de Fidélité »).\nElles sont complétées des conditions jointes ci-après applicables aux avantages complémentaires dont les Clients titulaires de la Carte de Fidélité qui le souhaitent peuvent bénéficier.\u003c/p\u003e\n\n\u003cp\u003eElles sont éditées par la société d’exploitation du point de vente sous l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» auprès de laquelle le Client a adhéré à la Carte de Fidélité (ci-après\u0026nbsp;: le «\u0026nbsp;Point de Vente\u0026nbsp;»), en conformité avec le programme de fidélisation mis en place par la société ITM ALIMENTAIRE INTERNATIONAL.\u003c/p\u003e\n\n\u003cp\u003eToute adhésion à la Carte de Fidélité dans le Point de Vente ainsi que son utilisation entraînent l’acceptation par le Client des présentes conditions générales d’utilisation et des conditions relatives aux avantages complémentaires qui y sont jointes, lesquelles lui ont toutes été présentées et/ou remises et dont le Client reconnait avoir pris connaissance lors de son adhésion.\u003c/p\u003e\n\n\u003cp\u003eLes conditions générales d’utilisation en vigueur sont également disponibles sur le site www.intermarche.com et l’application mobile (ci-après, ensemble\u0026nbsp;: les «\u0026nbsp;Supports Digitaux\u0026nbsp;»), sur simple demande à l’accueil du Point de Vente et sur demande écrite à l’attention du Service Carte de Fidélité Intermarché - CS61704 - 35517 Cesson Sévigné cedex.\n\u003cbr\u003e\n\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"25:T135c,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cb\u003eComment obtenir des Avantages Carte\u0026nbsp;?\u003cbr\u003e\u003c/b\u003e\u003cbr\u003eLe Client peut se voir accorder dans tous les points de vente de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» participant au programme de fidélité et sur les Supports Digitaux des Avantages Carte lors de l’achat de produits identifiés comme bénéficiant d’Avantages Carte.\u003cbr\u003e\u003cbr\u003eLes modalités d’obtention des Avantages Carte sont définies librement par le point de vente dans lequel les produits sont achetés et par l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;».\u003cbr\u003e\u003cbr\u003eLe détail de ces modalités est disponible sur le ou les support(s) associé(s) aux produits et/ou à l’opération commerciale concerné(es) (prospectus, site internet, affichage en points de vente, etc.).\u003c/p\u003e\u003cp\u003eIl sera demandé au Client, à chaque utilisation de sa Carte de Fidélité pour obtenir des Avantages Carte, de justifier de son identité. A défaut de pouvoir en justifier, il sera refusé au Client le bénéfice des Avantages Carte correspondants.\u0026nbsp;Seul le titulaire de la Carte de Fidélité et/ou éventuellement son mandataire pourra valablement l’utiliser.\u003cbr\u003e\u003cbr\u003eLes Avantages Carte alors accordés au Client sont ceux en vigueur au moment de l’achat des produits porteurs de l’offre.\u003cbr\u003e\u003cbr\u003eIls seront inscrits sur la Carte de Fidélité du Client au moment de l’achat des produits auxquels un avantage Carte est associé, ou au moment de leur retrait si ces produits sont retirés par le Client dans un \"Drive\" de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;».\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eComment connaitre le nombre et/ou le solde des Avantages Carte ?\u003cbr\u003e\u003c/b\u003e\u003cbr\u003eLe Client peut consulter le nombre et/ou le solde des Avantages Carte disponibles sur sa Carte de Fidélité :\u003cbr\u003e\u003cbr\u003e-sur les tickets de caisse et sur les Supports Digitaux.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eComment utiliser ses Avantages Carte\u0026nbsp;?\u003c/b\u003e\u003cbr\u003eLe Client utilise les Avantages Carte cumulés sur la Carte de Fidélité, en tout ou partie, sous forme de remises accordées lors d’achats ultérieurs effectués auprès des Points de Vente ou sur les Supports Digitaux.\u003cbr\u003e\u003cbr\u003ePour bénéficier de ces remises, le Client doit présenter sa Carte de Fidélité physique ou dématérialisée consultable sur mobile ainsi que sa pièce d’identité (carte nationale d’identité, passeport ou permis de conduire) lors de son passage en caisse ou au moment du retrait de sa commande dans un \"Drive\" de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;». En effet, seul le titulaire de la Carte de Fidélité et/ou éventuellement son mandataire est autorisé à utiliser les avantages disponibles. Il sera demandé à cette occasion au Client de signer un reçu sur lequel figure le montant des Avantages Carte utilisés lors de son achat.\u003cbr\u003e\u003cbr\u003eLe Client ne pourra décagnotter tout ou partie de ses Avantages Carte cumulés sur sa Carte de Fidélité qu’une seule fois par jour.\u003cbr\u003e\u003cbr\u003eLa Carte de Fidélité n’est en aucun cas une carte de paiement.\u003cbr\u003e\u003cbr\u003eLes Avantages Carte ne peuvent donc donner lieu ni à une contre-valeur en numéraire, ni à un rendu en monnaie.\u003cbr\u003e\u003cbr\u003eEn cas de retour par le Client d’un ou plusieurs produits ayant généré l’octroi d’Avantages Carte, le montant des Avantages Carte correspondant sera débité du solde de sa Carte de Fidélité.\u0026nbsp;Si le solde de la Carte de Fidélité est insuffisant, le montant des Avantages Carte sera retenu sur le prix des produits retournés.\u0026nbsp;\u003cbr\u003e\u003cbr\u003eEn cas d’échange par le Client d’un ou plusieurs produits ayant généré l’octroi d’Avantages Carte, le montant des Avantages Carte correspondant ne sera pas accordé une seconde fois.\u003c/p\u003e\u003cp\u003e\u003cb\u003eQuel montant d’Avantages Carte le Client peut-il cumuler sur sa Carte de Fidélité ?\u003c/b\u003e\u003cbr\u003eLe Client peut cumuler sur sa Carte de Fidélité des avantages équivalents à un montant maximum total de quatre cents (400) euros par mois civil.\u003c/p\u003e\u003cp\u003e\u003cb\u003eCombien de temps le Client peut-il utiliser ses Avantages Carte ?\u003c/b\u003e\u003cbr\u003eLes Avantages Carte cumulés sur sa Carte de Fidélité au cours d’une année civile (soit du 1er janvier au 31 décembre) sont à utiliser avant le 1er mars de l’année suivante. A défaut d’utilisation des Avantages Carte avant cette date, ceux-ci seront définitivement perdus.\u003cbr\u003e\u003cbr\u003eL’absence d’utilisation de la Carte de Fidélité pendant une durée de plus de vingt-quatre (24) mois mettra fin à l’adhésion du Client à celle-ci et entraînera la suppression totale des Avantages Carte cumulés jusqu’à cette date. Le Client ne recevra plus d’informations relatives à la Carte de Fidélité et/ou aux autres avantages mis en place par l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;».\u003c/p\u003e\u003cp\u003e\u003cb\u003eQuelles sont les catégories de produits exclus ?\u003c/b\u003e\u003cbr\u003eLa Carte de Fidélité ne permet pas de cumuler des Avantages Carte et n’est pas utilisable pour les produits suivants : les cartes cadeaux, les livres, la presse, le gaz et les carburants.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"26:T218a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cb\u003eQui peut adhérer à la Carte de Fidélité ?\u003cbr\u003e\u003c/b\u003e\u003cbr\u003ePour adhérer à la Carte de Fidélité, le Client doit en faire la demande auprès du Point de Vente ou sur les Supports Digitaux. L’adhésion est gratuite.\u003c/p\u003e\u003cp\u003eLa Carte de Fidélité est strictement réservée aux Clients de l’enseigne Intermarché pour une utilisation privée et à des fins non-professionnelles. Toute autre utilisation, notamment dans le cadre d’une activité professionnelle, commerciale, libérale, industrielle, ou artisanale, sera considérée comme frauduleuse et conduira à la perte du bénéfice de la Carte de Fidélité et des Avantages Carte.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUn Client ne peut bénéficier que d’une seule et unique Carte de Fidélité qu’elle soit matérielle ou dématérialisée.\u0026nbsp;(même nom, prénom, adresse e-mail et/ou numéro de téléphone).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eQuelles sont les formalités ?\u003cbr\u003e\u003c/b\u003e\u003cbr\u003e\u0026gt; Adhésion sur les Supports Digitaux\u003c/p\u003e\u003cp\u003eIl est possible d’adhérer au programme en renseignant directement les informations obligatoires sur les Supports Digitaux pour la création d’une Carte de Fidélité dématérialisée.\u003c/p\u003e\u003cp\u003eLes informations qui ont un caractère obligatoire lui seront indiquées par un astérisque, elles sont indispensables pour valider l’inscription du Client et permettre l’utilisation de la Carte de Fidélité. Les éventuelles informations facultatives qui pourraient lui être demandées permettent -pour leur part- de proposer au Client des avantages adaptés à ses centres d’intérêts. Il devra ensuite prendre connaissance et accepter les conditions générales d’utilisation et la politique données personnelles de la Carte de Fidélité.\u003c/p\u003e\u003cp\u003eLe Client garantit l'exactitude, l'intégrité et la véracité des données et informations communiquées.\u003c/p\u003e\u003cp\u003eTout formulaire d’inscription incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement l’inscription du Client.\u003c/p\u003e\u003cp\u003eLe Client disposera d’une Carte de Fidélité dématérialisée, nominative assortie d’un numéro d’adhésion dont il sera le seul et l’unique titulaire. La Carte de Fidélité dématérialisée est utilisable sur les Supports Digitaux et dans les points de vente participant au programme de fidélité.\u003c/p\u003e\u003cp\u003eLe Client devra présenter la Carte de Fidélité dématérialisée disponible sur son mobile en Point de Vente pour cumuler des Avantages Carte.\u003c/p\u003e\u003cp\u003eIl ne sera remis qu’une seule Carte de Fidélité dématérialisée par Client (même nom, prénom, adresse e-mail et/ou numéro de téléphone).\u003c/p\u003e\u003cp\u003e\u0026gt; Retrait de la carte en Point de vente et Adhésion ultérieure\u003c/p\u003e\u003cp\u003eLe Client recevra sa Carte de Fidélité en caisse et pourra l’activer ultérieurement sur les Supports Digitaux, sur la borne en Point de Vente, ou bien à l’accueil du Point de Vente.\u003cbr\u003e\u003cbr\u003eLa Carte de Fidélité remise sera accompagnée d’une mini-carte comportant le même identifiant et permettant uniquement de cumuler des Avantages Carte sur la Carte de Fidélité. L’utilisation de cette mini-carte est réservée au Client titulaire de la Carte de Fidélité (même nom, prénom, adresse e-mail et/ou numéro de téléphone).\u003c/p\u003e\u003cp\u003eDès la remise de la Carte de Fidélité, tous les achats effectués en caisse par le Client lui permettent de cumuler immédiatement et sans formalité des Avantages Carte.\u003c/p\u003e\u003cp\u003ePour pouvoir ensuite utiliser ses Avantages cagnottés, le Client devra activer sa Carte de Fidélité dans un délai maximum de deux (2) mois, à compter de la première utilisation. A défaut d’activation, sa Carte de Fidélité sera automatiquement résiliée et les Avantages Carte cumulés seront annulés.\u003c/p\u003e\u003cp\u003ePour activer sa Carte de Fidélité et ainsi bénéficier des Avantages Cartes cumulés, le Client dispose de plusieurs options détaillées ci-après.\u003c/p\u003e\u003cp\u003eQuelle que soit l’option privilégiée, le client devra renseigner les informations obligatoires pour activer sa Carte de Fidélité. Les informations qui ont un caractère obligatoire lui seront indiquées par un astérisque, elles sont indispensables pour valider l’inscription du Client et permettre l’utilisation de la Carte de Fidélité. Les éventuelles informations facultatives qui pourraient lui être demandées permettent -pour leur part- de proposer au Client des avantages adaptés à ses centres d’intérêts. Il devra ensuite prendre connaissance et accepter les conditions générales d’utilisation et la politique données personnelles de la Carte de Fidélité.\u003c/p\u003e\u003cp\u003eLe Client garantit l'exactitude, l'intégrité et la véracité des données et informations communiquées. Tout formulaire d’inscription incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement l’inscription du Client.\u003c/p\u003e\u003cp\u003eLe Client pourra ainsi activer sa Carte de Fidélité sur :\u003c/p\u003e\u003cp\u003e\u003cb\u003e\u003cu\u003eles Supports Digitaux :\u003cbr\u003e\u003c/u\u003e\u003c/b\u003eSur les Supports Digitaux, le Client devra créer un compte et compléter le formulaire d’inscription. Il devra alors renseigner le numéro de sa Carte de Fidélité, pour l’associer à son compte.\u003c/p\u003e\u003cp\u003eSi le Client possède déjà un compte sur les Supports Digitaux, il doit simplement renseigner le numéro de sa Carte de Fidélité sur ledit compte et éventuellement compléter les informations obligatoires à l’adhésion à la Carte de Fidélité.\u003c/p\u003e\u003cp\u003eLe Client pourra également dématérialiser sa Carte de Fidélité, pour pouvoir l’utiliser sur son mobile.\u003c/p\u003e\u003cp\u003e\u003cb\u003e\u003cu\u003ela borne en Point de Vente :\u003cbr\u003e\u003c/u\u003e\u003c/b\u003eLe Client doit renseigner sur la borne en Point de Vente les informations obligatoires pour adhérer à la Carte de Fidélité, prendre connaissance et accepter les conditions générales d’utilisation et la politique données personnelles de la Carte de Fidélité.\u003c/p\u003e\u003cp\u003eLe Client pourra également dématérialiser sa Carte de Fidélité, pour pouvoir l’utiliser sur son mobile.\u003c/p\u003e\u003cp\u003e\u003cb\u003e\u003cu\u003eà l’accueil du Point de Vente :\u003cbr\u003e\u003c/u\u003e\u003c/b\u003eLe Client doit fournir les informations obligatoires pour adhérer à la Carte de Fidélité ; ces données seront informatiquement renseignées. Le bulletin d’adhésion, les conditions générales d’utilisation et la politique données personnelles seront ensuite imprimés pour relecture et acceptation par le Client.\u003c/p\u003e\u003cp\u003eLors de l’adhésion à l’accueil du Point de Vente, le Client devra être muni de sa pièce d’identité. Le Client se verra remettre par le Point de Vente sa Carte de Fidélité disposant d’un numéro d’adhésion dont il sera le seul et l’unique titulaire ainsi que la copie des informations communiquées dans le cadre de son adhésion.\u003c/p\u003e\u003cp\u003eLe Client pourra également dématérialiser sa Carte de Fidélité, pour pouvoir l’utiliser sur son mobile.\u003c/p\u003e\u003cp\u003e\u003cb\u003eQue faire en cas de changement de coordonnées ?\u003cbr\u003e\u003c/b\u003e\u003cbr\u003eEn cas de changement de ses coordonnées personnelles, le Client devra en faire la déclaration directement au Point de Vente ou sur les Supports Digitaux.\u003cbr\u003e\u003cbr\u003eLe Client a également la faculté de changer le Point de Vente auquel sa Carte de Fidélité est attachée. A cet effet, le Client devra en faire la déclaration directement auprès du nouveau Point de Vente. Dans ce cadre, il conservera l’ensemble des Avantages Carte cumulés antérieurement.\u003c/p\u003e\u003cp\u003e\u003cb\u003eQue faire en cas de perte, de vol ou d’endommagement de sa Carte de Fidélité ?\u003cbr\u003e\u003cbr\u003e\u003c/b\u003eEn cas de perte, de vol ou d’endommagement de sa Carte de Fidélité, le Client devra, dès la constatation de l’événement, faire une déclaration auprès du Point de Vente. La Carte de Fidélité ainsi déclarée perdue, volée ou endommagée sera désactivée. Une nouvelle Carte de Fidélité nominative disposant d’un nouveau numéro d’adhésion sera remise au Client et les Avantages Carte cumulés avant la date de la déclaration seront transférés sur sa nouvelle Carte de Fidélité, après acceptation du Point de Vente et de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;».\u003c/p\u003e\u003cp\u003eLe cas échéant, il appartiendra ensuite au Client de mettre à jour son profil et de rattacher son nouveau numéro de Carte de fidélité à son compte pour continuer de bénéficier des avantages complémentaires de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» décrits dans les conditions jointes ci-après.\u003c/p\u003e\u003cp\u003eNi le Point de Vente, ni l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» ne pourront être tenus responsables, à l’égard du Client, en cas d’utilisation frauduleuse de la Carte de Fidélité.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"27:T598,\u003cp\u003e\n  Le Point de Vente et/ou l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» déclinent toute responsabilité, à l’égard du Client, en cas de\n  non-respect des présentes conditions générales d’utilisation et/ou des\n  conditions relatives aux avantages complémentaires qui y sont jointes.\n\u003c/p\u003e\n\u003cp\u003e\n  Le Point de Vente et/ou l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» se réservent le droit\n  d’engager toute action, notamment judiciaire, qu’ils jugeraient utile en cas\n  de déclaration erronée ou mensongère sur le bulletin d’adhésion et/ou\n  d’utilisation abusive ou frauduleuse de la Carte de Fidélité. Dans ces\n  hypothèses, le Client perdra le bénéfice de la Carte de Fidélité et de la\n  totalité des Avantages Carte ainsi que de l’ensemble des autres avantages\n  acquis auprès du Point de Vente et/ou de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;».\n\u003c/p\u003e\n\u003cp\u003e\n  Dans le cadre de l’utilisation des Supports Digitaux par le Client, la\n  responsabilité du Point de Vente et de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» ne saurait\n  être engagée pour tous les inconvénients, retard et/ou risque inhérents à l’utilisation par le Client d’internet tels que, notamment, une suspension du service, une intrusion ou la présence de virus informatique, à moins que lesdits inconvénients, retard et/ou risque\n  soient le fait du Point de Vente ou de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;».\u003cbr\u003e\n\u003c/p\u003e\n28:Tcc8,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cb\u003eDurée et modification\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\n  Les présentes conditions générales d’utilisation et les conditions relatives\n  aux avantages complémentaires peuvent être modifiées à tout moment.\n\u003c/p\u003e\n\u003cp\u003e\n  Le Client en sera préalablement informé par communication des nouvelles\n  conditions par tout moyen approprié (affichage en point de vente, prospectus,\n  Supports Digitaux, etc.).\n\u003c/p\u003e\n\u003cp\u003e\n  Dans le cas où le Point de Vente et/ou l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» ne seraient\n  plus en mesure d’assurer le bon fonctionnement de la Carte de Fidélité ou des autres avantages complémentaires\n  décrits dans les conditions jointes ci-après, ceux-ci pourront être suspendus\n  ou arrêtés. Une information en ce sens serait alors communiquée au Client par\n  tout moyen approprié.\n\u003c/p\u003e\n\u003cp\u003e\n  En cas de cessation, les Avantages Carte cumulés sur la Carte de Fidélité du\n  Client ainsi que les avantages complémentaires acquis en exécution des\n  conditions jointes ci-après pourront être utilisés pendant le délai qui sera\n  indiqué par le Point de Vente et/ou l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» et à l’issue\n  duquel ils seront définitivement perdus.\n\u003c/p\u003e\n\u003cp\u003e\n  \u003cb\u003eIntégralité\u003c/b\u003e\n\u003c/p\u003e\n\u003cp\u003e\n  Dans le cas où l'une quelconque des clauses des conditions générales\n  d’utilisation et/ou des conditions relatives aux avantages complémentaires\n  serait réputée ou déclarée nulle ou non écrite, les autres clauses resteront\n  intégralement en vigueur.\n\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eDroit applicable et litiges\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\n  Les présentes conditions générales d’utilisation et les conditions relatives\n  aux avantages complémentaires qui y sont jointes sont soumises au droit\n  français, sauf dispositions impératives contraires telles que découlant du\n  Règlement CE n°593/2008 du 17 juin 2008 sur la loi applicable aux obligations\n  contractuelles (Rome I).\n\u003c/p\u003e\n\u003cp\u003e\n  En cas de différend relatif notamment à l’interprétation, l’exécution et/ou\n  résolution des conditions générales d’utilisation et/ou des conditions\n  relatives aux avantages complémentaires, à l’octroi de la Carte de Fidélité, à\n  l’utilisation des Avantages Cartes et de l’un quelconque desdits avantages\n  complémentaire, le Client est invité à s’adresser par priorité au Service\n  Carte de Fidélité Intermarché pour tenter de trouver une solution amiable :\n\u003c/p\u003e\n\u003cp\u003e\n  en écrivant à l’adresse suivante : Service Carte de Fidélité Intermarché – CS\n  61704 – 35510 Cesson Sévigné, ou en envoyant un e-mail à l’adresse suivante :\n  cartefidelite@mousquetaires.com.\n\u003c/p\u003e\n\u003cp\u003e\n  Faute de règlement direct dudit différend entre les parties, le Client est informé :\n\u003c/p\u003e\n\u003cp\u003e\n  de l’existence d’une plateforme de règlement en ligne des litiges à laquelle\n  il peut accéder ici :\n  \u003ca href=\"http://ec.europa.eu/consumers/odr/\" style=\"word-break: break-all\"\u003ehttp://ec.europa.eu/consumers/odr/\u003c/a\u003e, et\n\u003c/p\u003e\n\u003cp\u003e\n  qu’il peut recourir -avant toute action en justice- au médiateur MCCA\n  (Médiation du Commerce Coopératif et Associé), dont les coordonnées postales\n  sont les suivantes : 77, rue de Lourmel - 75015 Paris et dont l'adresse du\n  site internet est la suivante : www.mcca-mediation.fr.\n\u003c/p\u003e"])</script><script>self.__next_f.push([1,"29:T66fd,"])</script><script>self.__next_f.push([1,"\u003cp\u003eL’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» a constitué des groupes réunissant différentes catégories de Clients titulaires de la Carte de Fidélité, dans le but de renforcer la relation privilégiée nouée avec chacun d’entre eux et de leur proposer d’accéder à des offres spécifiques adaptées à leurs centres d’intérêts (ci-après : la(es) «\u0026nbsp;Communauté(s)\u0026nbsp;»).\u003c/p\u003e\n\u003cp\u003eL’inscription à chacune des Communautés est gratuite. Elle permet au Client de bénéficier d’avantages auprès de tous les points de vente de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» et Drive participant au programme de fidélité de ladite enseigne.\u003c/p\u003e\n\u003cp\u003ePour s'inscrire à l’une ou plusieurs des Communautés et sous réserve des éventuelles règles qui leur sont spécifiques, le Client doit\u0026nbsp;:\u003c/p\u003e\n\u003cp\u003e- être titulaire d’un compte digital et d’une Carte de Fidélité rattachée, étant précisé qu’une seule inscription par Communauté et par Carte de Fidélité est possible,\u003c/p\u003e\n\u003cp\u003e- remplir un formulaire d’inscription en ligne sur le site Intermarché\u003c/p\u003e\n\u003cp\u003eLes informations du formulaire qui ont un caractère obligatoire sont signalées par un astérisque, elles sont indispensables pour valider l’inscription à la Communauté choisie. Les informations facultatives qui pourraient y être demandées permettent -pour leur part- de proposer au Client des avantages adaptés à ses centres d’intérêts.\u003c/p\u003e\n\u003cp\u003eTout formulaire d’inscription incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement l’inscription du Client à la Communauté choisie.\u003c/p\u003e\u003cp\u003e- et adresser les pièces justificatives demandées en les téléchargeant directement sur le site susmentionné au format PDF, jpeg, png ou gif (le poids par fichier ne devant pas excéder 10 Mo).\u003c/p\u003e\n\u003cp\u003eAprès réception de l’ensemble de ces éléments et validation de la demande d’inscription, un e-mail de confirmation sera adressé au Client.\u003c/p\u003e\n\u003cp\u003eCe dernier pourra alors accéder à la Communauté automatiquement. Un e-mail sera envoyé pour informer le Client de la validité de son adhésion et de l’activation effective de tels Avantages Carte. La validation de l’inscription à la communauté peut prendre jusqu’à 5 jours ouvrés.\u003c/p\u003e\n\n\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003e1.1 «\u0026nbsp;INTERMARCHE FAMILLES NOMBREUSES\u0026nbsp;»\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.1.1 Qu’est-ce que la Communauté «\u0026nbsp;Intermarché Familles Nombreuses\u0026nbsp;»\u0026nbsp;?\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eIl s’agit d’une Communauté réunissant des Clients appartenant à des familles nombreuses.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.1.2 Conditions spécifiques d’adhésion\u003c/b\u003e\u003c/p\u003e\u003cp\u003ePour adhérer à la Communauté «\u0026nbsp;Intermarché Familles Nombreuses\u0026nbsp;», le Client doit\u0026nbsp;:\u003c/p\u003e\u003cul\u003e\u003cli\u003e- Avoir trois (3) enfants nés ou plus, dont au moins un (1) enfant mineur (âgé de moins de 18 ans),\u003c/li\u003e\u003cli\u003e- Remplir le formulaire d’inscription en ligne sur le site Intermarché.\u003cp\u003eLes informations du formulaire qui ont un caractère obligatoire sont signalées par un astérisque, elles sont indispensables pour valider la demande d’inscription à la communauté Intermarché familles nombreuses. Les informations facultatives qui pourraient y être demandées permettent -pour leur part- de proposer au Client des avantages adaptés à ses moments de vie.\u003c/p\u003e\u003cp\u003eTout formulaire d’inscription incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement la demande d’inscription à la communauté Intermarché familles nombreuses, et\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003eTélécharger les pièces justificatives suivantes directement sur le site susmentionné au format PDF, jpeg, png ou gif (le poids par fichier ne devant pas excéder 10 Mo) :\u003cbr\u003e\u003cul\u003e\u003cli\u003e- une copie du livret de famille (photocopies de toutes les pages du livret) ou d’extraits d’acte de naissance des enfants mentionnés sur ledit bulletin, et\u003c/li\u003e\n\u003cli\u003e- pour les enfants adoptés et les enfants ayant un nom de famille différent de celui du Client titulaire de la Carte de Fidélité : l’attestation d’hébergement datée et signée certifiant que l’enfant a été confié audit Client en précisant son nom, prénom et date de naissance et l’extrait d’acte de naissance.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eDans ce cadre, la communication des données personnelles relatives aux mineurs est soumise à l'autorisation et à la responsabilité conjointe des parents ou des titulaires de l'autorité parentale.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLe Client qui détient la carte Familles Nombreuses peut valablement transmettre une copie de celle-ci ou sa version dématérialisée à la place des documents susvisés à titre de justificatif. Les prénom et nom inscrits sur la carte Familles Nombreuses doivent être identiques à ceux renseignés sur la carte de fidélité du Client.\u003c/p\u003e\u003cp\u003eLa copie ou la version dématérialisée de la carte Familles Nombreuses doit être téléchargée au format PDF, jpeg, png ou gif (le poids par fichier ne devant pas excéder 10 Mo).\u003c/p\u003e\u003cp\u003eLes justificatifs sont conservés pour la durée nécessaire à l’étude de votre demande d’inscription et, seront supprimés au maximum dans les 3 mois suivant l’étude de votre demande.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAprès réception et étude de l’ensemble de ces éléments, le Client sera informé par email de la confirmation ou du refus de son inscription.\u003c/p\u003e\u003cp\u003eEn cas de confirmation de l’inscription à la communauté Intermarché familles nombreuses, un email sera envoyé pour informer le Client de la validité de son adhésion et de l’activation effective de tels Avantages Carte. La validation de l’inscription à la communauté peut prendre jusqu’à 5 jours ouvrés.\u003c/p\u003e\u003cp\u003e\u003cb\u003e1.1.3 Quels sont les avantages de la Communauté «\u0026nbsp;Intermarché Familles Nombreuses\u0026nbsp;»\u0026nbsp;?\u003c/b\u003e\u003c/p\u003e\u003cp\u003eIl est proposé au Client s’étant inscrit à la Communauté «\u0026nbsp;Intermarché familles nombreuses\u0026nbsp;»\u0026nbsp;:\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e- de recevoir l’actualité de la Communauté «\u0026nbsp;Intermarché familles nombreuses\u0026nbsp;» dans ses newsletters, s’il a accepté de recevoir les Newsletters Intermarché ; et\u003cbr\u003e\u003c/li\u003e\u003cli\u003e- de bénéficier tous les jours d’Avantages Carte correspondant à dix pour cent (10%) du montant de ses achats de produits des marques «\u0026nbsp;Chabrior\u0026nbsp;», « Paquito\u0026nbsp;» et «\u0026nbsp;Pâturages\u0026nbsp;» (hors fromages à poids variable vendus en libre-service), ajoutés sur sa Carte de Fidélité dans une limite de vingt (20) euros maximum par mois.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eLedit Avantage Carte n’est pas cumulable avec toute autre offre promotionnelle ou avantage fidélité.\u003c/p\u003e\n\u003cbr\u003e\n\n\u003cp\u003e\u003cb\u003e1.2«\u0026nbsp;INTERMARCHE BÉBÉS\u0026nbsp;»\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.2.1 Qu’est-ce que la Communauté «\u0026nbsp;Intermarché Bébés\u0026nbsp;»\u0026nbsp;?\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eIl s’agit d’une Communauté de Clients réunissant les futurs parents, les jeunes parents mais aussi les grands-parents et les professionnels de la petite enfance.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.2.2 Conditions spécifiques d’adhésion\u003c/b\u003e\u003c/p\u003e\u003cp\u003ePour s’inscrire à la Communauté «\u0026nbsp;Intermarché bébés\u0026nbsp;», le client doit renseigner un enfant à naitre ou un enfant âgé de moins de vingt-quatre (24) mois en indiquant sa date de naissance ou sa date présumée de naissance.\u003c/p\u003e\u003cp\u003eEn cas de naissance ou d’accueil d’un nouvel enfant, le Client devra pouvoir bénéficier à nouveau ou continuer de bénéficier des avantages spécifiques liés à la Communauté «\u0026nbsp;Intermarché bébés\u0026nbsp;» en s'inscrivant à nouveau à la communauté et en renseignant les informations requises.\u003c/p\u003e\u003cp\u003eDans ce cadre, la communication des données personnelles relatives aux mineurs est soumise à l'autorisation et à la responsabilité conjointe des parents ou des titulaires de l'autorité parentale.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.2.3 Quels sont les avantages du programme «\u0026nbsp;Intermarché Bébés\u0026nbsp;»\u0026nbsp;?\u003c/b\u003e\u003c/p\u003e\u003cp\u003eIl est proposé au Client inscrit à la Communauté\u0026nbsp;«\u0026nbsp;Intermarché Bébés\u0026nbsp;»\u0026nbsp;:\u003c/p\u003e\u003cul\u003e\u003cli\u003e- de recevoir l’actualité de la Communauté «\u0026nbsp;Intermarché bébés\u0026nbsp;» dans ses newsletters, s’il a accepté de recevoir les Newsletters Intermarché ; et\u003c/li\u003e\u003cli\u003e- de bénéficier tous les jours d’Avantages Carte correspondant à dix pour cent (10%) du montant de ses achats de produits dans les rayons bébé (à savoir : alimentation bébé (excepté le lait 1er âge), hygiène bébé, coton et couche, petite puériculture, grosse puériculture, chaussures pour bébé, layette bébé), ajoutés sur sa Carte de Fidélité dans une limite de trente (30) euros maximum par mois\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eLedit Avantage Carte n’est pas cumulable avec toute autre offre promotionnelle ou avantage fidélité.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:18.0pt;mso-outline-level:3\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 11.5pt; font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e1.3 « LA COMMUNAUTÉ ETUDIANTS\u0026nbsp;»\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eL’enseigne « Intermarché » propose\négalement à ses Clients titulaires de la Carte de Fidélité qui ont entre 18 et\n28 ans révolus et ayant un statut étudiant d’accéder à des offres spécifiques\net ponctuelles permettant de soutenir leur pouvoir d’achat (ci-après : «\u0026nbsp;la\nCommunauté étudiants »).\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cb\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e1.3.1. INSCRIPTION\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eL’inscription à la Communauté\nétudiants est gratuite. Elle permet au Client de bénéficier d’avantages\nponctuels auprès de tous les points de vente de l’enseigne « Intermarché » et\nDrive participant au programme de fidélité de ladite enseigne.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003ePour s’inscrire à la Communauté\nétudiants, le Client doit :\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cul style=\"margin-top:0cm\" type=\"disc\"\u003e\n \u003cli class=\"MsoNormal\" style=\"margin-top: 4.5pt; margin-bottom: 4.5pt; text-align: justify; line-height: normal;\"\u003e\u003cspan style=\"font-family:\u0026quot;Open Sans\u0026quot;,sans-serif;mso-fareast-font-family:\n     \u0026quot;Times New Roman\u0026quot;;mso-font-kerning:0pt;mso-ligatures:none;mso-fareast-language:\n     FR\"\u003e- être titulaire d’un compte digital et d’une Carte de Fidélité,\n     rattachée à ce dernier, étant précisé qu’une seule inscription par Carte\n     de Fidélité est possible,\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/li\u003e\n \u003cli class=\"MsoNormal\" style=\"margin-top: 4.5pt; margin-bottom: 4.5pt; text-align: justify; line-height: normal;\"\u003e\u003cspan style=\"font-family:\u0026quot;Open Sans\u0026quot;,sans-serif;mso-fareast-font-family:\n     \u0026quot;Times New Roman\u0026quot;;mso-font-kerning:0pt;mso-ligatures:none;mso-fareast-language:\n     FR\"\u003e- avoir entre 18 ans et 28 ans révolus\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/li\u003e\n \u003cli class=\"MsoNormal\" style=\"margin-top: 4.5pt; margin-bottom: 4.5pt; text-align: justify; line-height: normal;\"\u003e\u003cspan style=\"font-family:\u0026quot;Open Sans\u0026quot;,sans-serif;mso-fareast-font-family:\n     \u0026quot;Times New Roman\u0026quot;;mso-font-kerning:0pt;mso-ligatures:none;mso-fareast-language:\n     FR\"\u003e- avoir un statut étudiant (sur l’année scolaire en cours)\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/li\u003e\n \u003cli class=\"MsoNormal\" style=\"margin-top: 4.5pt; margin-bottom: 4.5pt; text-align: justify; line-height: normal;\"\u003e\u003cspan style=\"font-family:\u0026quot;Open Sans\u0026quot;,sans-serif;mso-fareast-font-family:\n     \u0026quot;Times New Roman\u0026quot;;mso-font-kerning:0pt;mso-ligatures:none;mso-fareast-language:\n     FR\"\u003e- remplir un formulaire d’inscription en ligne sur le site\n     Intermarché.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eLes informations du formulaire qui\nont un caractère obligatoire sont signalées par un astérisque, elles sont\nindispensables pour valider la demande d’inscription à la Communauté étudiants.\nLes informations facultatives qui pourraient y être demandées permettent -pour\nleur part- de proposer au Client des avantages adaptés à ses moments de vie.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eTout formulaire d’adhésion\nincomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider\ndéfinitivement la demande d’inscription du Client à la Communauté étudiants, et\ntélécharger les pièces justificatives suivantes directement sur le site\nsusmentionné au format PDF, jpeg, png ou gif (le poids par fichier ne devant\npas excéder 10 Mo) :\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e- une copie de la carte étudiant\nfrançaise ou un certificat de scolarité français de l’année scolaire en cours ;\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e- un justificatif d’identité en\ncours de validité en France (copie recto-verso de la carte d’identité nationale\nou du titre de séjour, ou copie des deux pages d’identification du passeport).\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eLes justificatifs doivent être aux\nmêmes nom et prénom que le titulaire de la carte de fidélité qui réalise la\ndemande d’inscription.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eEn cas de suspicion de fraude, il\npourra être demandé au Client de communiquer les justificatifs originaux par\nvoie postale ou digitale. Ces documents devront être envoyés par le Client dans\nun délai de trois (3) semaines maximums suivant la date de réception de la\ndemande (date d’envoi de l’email ou cachet de la poste faisant foi).\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eLes justificatifs sont conservés\npour la durée nécessaire à l’étude de votre demande d’inscription et, seront\nsupprimés au maximum dans les 3 mois suivant l’étude de votre demande.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eAprès réception et étude de\nl’ensemble de ces éléments, le Client sera informé par email de la confirmation\nou du refus de son inscription.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eEn cas de confirmation\nd’inscription à la Communauté étudiants, un email sera envoyé pour en informer\nle Client. La validation à la Communauté étudiants peut prendre jusqu’à 5 jours\nouvrés.\u003c/span\u003e\u003c/p\u003e\n\n\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cb\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e1.3.2. CARACTERISTIQUES ET RESTRICTIONS\u003c/span\u003e\u003c/b\u003e\n\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal;font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eQuels sont les avantages proposés aux Clients inscrits à la Communauté étudiants   \n? Il est proposé au Client inscrit à la Communauté étudiants :\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal;font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\n- de recevoir l’actualité de la Communauté étudiants dans ses newsletters, s’il a   \naccepté de recevoir les Newsletters Intermarché, et\u003cbr\u003e\n- de bénéficier tous les 28 de chaque mois d’Avantages Carte correspondant à   \nquarante pour cent (40%) du montant de ses achats de produits d’hygiène   \nféminine de la marque Labell (y compris les culottes menstruelles), ajoutés sur sa   \nCarte de Fidélité dans une limite de dix (10) euros maximum cumulés.\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal;font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e \nLedit Avantage Carte n’est pas cumulable avec toute autre offre promotionnelle ou   \navantage fidélité.\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal;font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e \n- de bénéficier d’offres d’Avantages Carte ponctuelles tout au long de l’année   \najoutés sur sa Carte de Fidélité.\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal;font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\nLedit Avantage Carte n’est pas cumulable avec toute autre offre promotionnelle ou   \navantage fidélité.  \n\u003c/p\u003e\n\n\n\n\n\n\n\u003cp class=\"MsoNormal\" style=\"margin-bottom:0cm;text-align:justify;line-height:\nnormal\"\u003e\u003cb\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003ePlafond des inscriptions\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eLa Communauté étudiants est limitée\naux cent mille (100 000) premières demandes d’inscription confirmées. Dès lors\nque ce plafond est atteint, aucune demande d’inscription complémentaire, même\nvalide, ne sera acceptée.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"margin-bottom:0cm;text-align:justify;line-height:\nnormal\"\u003e\u003cb\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003ePériode de validité\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eL’inscription à la Communauté\nétudiants est valable jusqu’à la fin du mois d’octobre de chaque année.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eElle doit être renouvelée chaque\nannée entre le 1er octobre et le 31 octobre.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eLes Clients inscrits à la\nCommunauté étudiants seront invités à renouveler leur inscription et ce, en\nsuivant les mêmes étapes que celles susmentionnées.\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003eLe traitement des dossiers de\nrenouvellement sera prioritaire sur de nouvelles demandes d’inscriptions, en\ncas d’atteinte du plafond de membres inscrits à la Communauté étudiants.\u003c/span\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;\ntext-align:justify;line-height:normal\"\u003e\u003cspan style=\"font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\u003cbr\u003e\u003c/span\u003e\u003cspan style=\"font-size: 11.5pt; font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e\u003co:p\u003e\u003c/o:p\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\n\n\u003c/p\u003e\u003cp\u003e\u003cb style=\"text-align: justify;\"\u003e\u003cspan style=\"font-size: 11.5pt; font-family: \u0026quot;Open Sans\u0026quot;, sans-serif;\"\u003e1.4 « LA COMMUNAUTÉ PETITS BUDGETS »\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eL’enseigne « Intermarché » propose également à ses Clients titulaires de la Carte de Fidélité et ayant un quotient familial inférieur ou égal à\u0026nbsp; neuf cents (900) Euros, d’accéder à des offres spécifiques permettant de soutenir leur pouvoir d’achat (ci-après : « la communauté petits budgets »).\u003cbr\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.4.1. INSCRIPTION\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eL’inscription à la communauté petits budgets est gratuite. Elle permet au Client de bénéficier d’avantages auprès de tous les points de vente de l’enseigne « Intermarché » et Drive participant au programme de fidélité de ladite enseigne.\u003c/p\u003e\n\n\u003cp\u003ePour s’inscrire à la communauté petits budgets, le Client doit :\u003c/p\u003e\u003cul\u003e\u003cli\u003e- être titulaire d’un compte digital et d’une Carte de Fidélité, rattachée à ce dernier, étant précisé qu’une seule inscription par Carte de Fidélité est possible,\u003c/li\u003e\u003cli\u003e- être bénéficiaire d’un quotient familial inférieur ou égal à neuf cents (900) Euros,\u003c/li\u003e\u003cli\u003e- remplir un formulaire d’inscription en ligne sur le site Intermarché.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eLes informations du formulaire qui ont un caractère obligatoire sont signalées par un astérisque, elles sont indispensables pour valider la demande d’inscription à la communauté petits budgets. Les informations facultatives qui pourraient y être demandées permettent -pour leur part- de proposer au Client des avantages adaptés à ses moments de vie.\u003c/p\u003e\n\n\u003cp\u003eTout formulaire d’adhésion incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement la demande d’inscription du Client à la communauté petits budgets, et :\u003c/p\u003e\u003cul\u003e\u003cli\u003etélécharger les pièces justificatives suivantes directement sur le site susmentionné au format PDF, jpeg, png ou gif (le poids par fichier ne devant pas excéder 10 Mo) :\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e- une attestation de quotient familial, issue de la Caisse d’Allocation Familiale française (CAF) ou de la Mutualité Sociale Agricole (MSA), attestant d’un quotient familial inférieur ou égal à neuf cents (900) Euros, datant de moins d’un mois ;\u003c/p\u003e\n\n\u003cp\u003e- un justificatif d’identité en cours de validité en France (copie recto-verso de la carte d’identité nationale ou du titre de séjour, ou copie des deux pages d’identification du passeport).\u003c/p\u003e\n\n\u003cp\u003eLes justificatifs doivent être aux mêmes nom et prénom que le titulaire de la carte de fidélité qui réalise la demande d’inscription.\u003c/p\u003e\u003cp\u003eEn cas de suspicion de fraude, il pourra être demandé au Client de communiquer les justificatifs originaux par voie postale ou digitale, accompagné de son dernier avis d’imposition. Ces documents devront être envoyés par le Client dans un délai de trois (3) semaines maximum suivant la date de réception de la demande (date d’envoi de l’email ou cachet de la poste faisant foi).\u003c/p\u003e\n\n\u003cp\u003eLes justificatifs sont conservés pour la durée nécessaire à l’étude de votre demande d’inscription et, seront supprimés au maximum dans les 3 mois suivant l’étude de votre demande.\u003c/p\u003e\u003cp\u003eAprès réception et étude de l’ensemble de ces éléments, le Client sera informé par email de la confirmation ou du refus de son inscription.\u003c/p\u003e\n\n\u003cp\u003eEn cas de confirmation d’inscription à la communauté petits budgets, un email sera envoyé pour informer le Client de l’activation effective de tels Avantages Carte. La validation à la communauté Petits Budgets peut prendre jusqu’à 5 jours ouvrés.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e1.4.2. CARACTERISTIQUES ET RESTRICTIONS\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e\u003c/b\u003eQuels sont les avantages proposés aux Clients inscrits à « la communauté petits budgets » ?\u003c/p\u003e\u003cp\u003eIl est proposé au Client inscrit à la communauté petits budgets :\u003c/p\u003e\n\n\u003cp\u003e- de recevoir l’actualité de la communauté petits budgets dans ses newsletters, s’il a accepté de recevoir les Newsletters Intermarché, et\u003c/p\u003e\n\n\u003cp\u003e- de bénéficier tous les jours d’Avantages Carte correspondant à cinq pour cent (5%) du montant de ses achats de produits dans l’ensemble du magasin (à l’exclusion des boissons alcoolisées), ajoutés sur sa Carte de Fidélité dans une limite de vingt (20) euros maximum par mois.\u003c/p\u003e\n\n\u003cp\u003eLedit Avantage Carte n’est pas cumulable avec toute autre offre promotionnelle ou avantage fidélité.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003ePlafond des inscriptions\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eLa communauté petits budgets est limitée aux cent trente mille (130 000) premières demandes d’inscription confirmées. Dès lors que ce plafond est atteint, aucune demande d’inscription complémentaire, même valide, ne sera acceptée.\u003c/p\u003e\u003cp\u003e\u003cb\u003ePériode de validité\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eL’inscription à la communauté petits budgets est valable jusqu’à la fin du mois de février de chaque année.\u003c/p\u003e\n\n\u003cp\u003eElle doit être renouvelée chaque année entre le 1er février et le dernier jour du mois de février.\u003c/p\u003e\n\n\u003cp\u003eLes Clients inscrits à la communauté petits budgets seront invités à renouveler leur inscription et ce, en suivant les mêmes étapes que celles susmentionnées.\u003c/p\u003e\n\n\u003cp\u003eLe traitement des dossiers de renouvellement sera prioritaire sur de nouvelles demandes d’inscriptions, en cas d’atteinte du plafond de membres inscrits à la communauté petits budgets.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\"\u003e\u003cbr\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\"\u003e\u003cbr\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"2a:Tf95,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cb\u003e2.1 DESCRIPTION\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eL’enseigne \"Intermarché\" propose aux Clients titulaires de la Carte de Fidélité des opérations commerciales consistant dans la collecte de vignettes permettant d’obtenir une réduction de prix sur une gamme de produits mise en avant par l’opération (ci-après « Opération »). Ces vignettes sont à collecter sur un collecteur (ci-après : « Vignettes »).\u003cbr\u003e\n\nLes informations spécifiques de chaque Opération figurent dans les modalités de l’Opération disponibles dans les Points de Vente participants ou sur le site de l’Opération.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003e2.2 CARACTÉRISTIQUES ET RESTRICTIONS\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003eComment obtenir des Vignettes\u0026nbsp;?\u003c/b\u003e\u003cbr\u003e\nLes Vignettes sont proposées dans les Points de Vente participant à l’Opération dont la liste est mise à jour pour chaque Opération et disponible sur le site de l’Opération.\u003cbr\u003e\nPour obtenir des Vignettes, le Client titulaire d’une Carte de Fidélité doit effectuer des achats en magasin ou sur les Supports Digitaux pendant les dates de l’Opération.\nUne (1) Vignette est collectée par tranche d’achat définie dans les modalités de l’Opération (hors produits expressément exclus), et pour l’achat de produits partenaires de l’Opération.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003eQuels sont les avantages des Vignettes \u0026nbsp;?\u003c/b\u003e\u003cbr\u003e\nLes Vignettes cumulées permettent au Client d’obtenir une réduction de prix sur la gamme de produits de l’Opération.\u003cbr\u003e\nLa réduction de prix accordée sur chaque produit et le nombre de Vignettes nécessaire pour l’obtenir sont définis dans les modalités de l’Opération.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003eCombien de temps sont valables les Vignettes\u0026nbsp;?\u003c/b\u003e\u003cbr\u003e\nLes Vignettes peuvent être cumulées et utilisées pendant les dates de l’Opération en cours. A défaut d’utilisation des Vignettes avant la fin de l’Opération au cours de laquelle elles ont été cumulées, celles-ci seront définitivement perdues.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eComment utiliser les Vignettes\u0026nbsp;?\u003c/b\u003e\u003cbr\u003e\nLe Client peut utiliser les Vignettes collectées sur son collecteur papier lors de son passage en caisse, en tout ou partie, hors caisses libre-service, scan libre et Drive, pour obtenir une réduction de prix sur la gamme de produits de l’Opération.\u003cbr\u003e\nA cet effet, le Client doit avoir collecté le nombre de Vignettes nécessaires à l’octroi de la réduction de prix, tel que prévu dans les modalités de l’Opération. Il doit présenter sa Carte de Fidélité physique ou dématérialisée consultable sur mobile ainsi que sa pièce d’identité lors de son passage en caisse avec ledit produit. Seul le titulaire de la Carte de Fidélité et/ou éventuellement son mandataire est autorisé à utiliser les Vignettes.\u003cbr\u003e\nLe Client doit s’assurer que sa Carte de Fidélité est activée, à défaut il ne pourra pas utiliser ses Vignettes.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003eExclusions, fraudes et perte des Vignettes\u003c/b\u003e\u003cbr\u003e\nLes Vignettes ne peuvent être troquées, négociées, et/ou échangées contre des espèces ou pour l'octroi d'un crédit. Elles n'ont pas de valeur monétaire, ne constituent pas un titre de propriété et ne donnent pas un droit ou un intérêt acquis. Les Vignettes ne peuvent donc donner lieu ni à une contre-valeur en numéraire, ni à un rendu en monnaie.\u003cbr\u003e\nEn cas d’échange par le Client d’un ou plusieurs produits ayant généré l’octroi de Vignettes, le nombre des Vignettes correspondant ne sera pas accordé une seconde fois.\nDans le cas où les Vignettes n’auraient pas été obtenues par des moyens légitimes et, plus particulièrement, en conformité avec les modalités de l’Opération ou les présentes conditions générales d’utilisation, celles-ci seraient nulles et non avenues et, par conséquent, refusées.\u003cbr\u003e\nDans le cas où le Client ne peut plus bénéficier de sa Carte de Fidélité en raison du non-respect des présentes conditions générales d’utilisation, ce dernier perdra le bénéfice des Vignettes.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"2b:T1592,"])</script><script>self.__next_f.push([1,"\u003cp\u003eL’enseigne \"Intermarché\" propose également à ses Clients titulaires de la Carte de Fidélité de participer à des défis gagnants («Mes Défis Gagnants »). La participation aux défis gagnants permet au Client de bénéficier d’avantage carte lors de l’atteinte du montant indiqué pour l’achat de produits éligibles aux défis.\u003c/p\u003e\n\u003cp\u003eMes Défis Gagnants sont personnalisés en fonction de l’historique d’achat du Client. Les données collectées dans le cadre de Mes Défis Gagnants sont traitées conformément à la politique données personnelles ci-après.\u003c/p\u003e\n\u003cp\u003eVous pouvez exercer votre droit d’opposition en envoyant un mail à \u003cspan style=\"word-break: break-all;\"\u003edpointermarche@mousquetaires.com\u003c/span\u003e et en indiquant dans le corps de votre demande que vous vous opposez à recevoir des défis gagnants et en précisant le numéro de votre carte de fidélité.\u003c/p\u003e\n\u003cp\u003eSi vous exercez votre droit d’opposition, il pourra vous être proposé des défis non personnalisés en fonction de vos historiques d’achat.\u003c/p\u003e\n\u003cp style=\"text-transform: uppercase\"\u003e\u003cb\u003e3.1 Inscription\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eAfin de pouvoir consulter  Mes Défis Gagnants, le Client doit être titulaire d’une Carte de Fidélité et doit créer un compte en complétant le formulaire d’inscription sur les Supports Digitaux.\u003c/p\u003e\n\u003cp\u003eSi le Client possède déjà un compte créé sur les Supports Digitaux, il doit simplement renseigner le numéro de sa Carte de Fidélité sur ledit compte.\u003c/p\u003e\n\u003cp\u003eLes informations du formulaire qui ont un caractère obligatoire sont signalées par un astérisque, elles sont indispensables pour valider l’inscription du Client. Les informations facultatives qui pourraient y être demandées permettent -pour leur part- de proposer au Client des avantages et offres adaptés à ses centres d’intérêts.\u003c/p\u003e\n\u003cp\u003eTout formulaire d’inscription incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement l’inscription du Client.\u003c/p\u003e\n\u003cp\u003eA l’issue de son inscription, un email de confirmation d'inscription sera adressé au Client ;\u003c/p\u003e\n\u003cp style=\"text-transform: uppercase\"\u003e\u003cb\u003e3.2 Caracteristiques et restrictions\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eComment participer à Mes Défis Gagnants\u0026nbsp;?\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eMes Défis Gagnants sont proposés dans l’onglet « Mes Avantages » présent sur le compte du client accessible sur les Supports Digitaux. Lors de chaque passage en caisse, le Client devra passer sa carte de fidélité pour comptabiliser l’ensemble des achats concernant les produits faisant l’objet du défi.\u003c/p\u003e\n\u003cp\u003eLes achats pris en compte pour la réalisation du défi sont ceux dont la date d’achat en magasin est comprise dans la période du défi et ceux dont la date de retrait des commandes drive est comprise dans la période du défi.\u003cbr\u003e\nDans le cas de remise sur un produit faisant l’objet d’un défi, le montant comptabilisé dans le compteur du défi sera le montant remise déduite.\u003c/p\u003e\n\u003cp\u003eCes défis gagnants sont automatiquement disponibles sur la Carte de Fidélité du client si le Client n’a pas exercé son droit d’opposition à bénéficier de ces derniers.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003ePériode de validité\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eChacun des défis est valable pendant la durée précisée sur les défis. Vous pouvez prendre connaissance des modalités sur les opérations en cours.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eConditions de chacun Mes Défis Gagnants\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eChacun de Mes Défis gagnants devra être appliqué dans les conditions précisées sur ceux-ci ou sur les Supports Digitaux, telles que :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e- le ou les produits sur lesquels portent les défis gagnants devront être achetés pendant la durée de l’opération commerciale\u003c/li\u003e\n    \u003cli\u003e- le montant à atteindre par palier pour bénéficier des avantages cartes associés à l’opération, etc.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIl appartient au Client de prendre connaissance et d'accepter l'ensemble desdites conditions applicables à chacun des défis gagnants, préalablement à son utilisation.\u003c/p\u003e\n\u003cp\u003eLes avantages cartes cagnottés grâce aux défis gagnants s’utilisent conformément au point 2 des présentes Conditions Générales de la Carte de Fidélité.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eDisponibilité des produits\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eLes produits requis à l'achat pour alimenter le compteur des défis gagnants, peuvent ne pas être disponibles à tout moment dans un point de vente participant, ce que le Client reconnaît et accepte.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eInterdictions\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eLes Défis gagnants ne peuvent être cédés, troqués, négociés, transférés et/ou échangés contre des espèces ou pour l'octroi d'un crédit. Elles n'ont pas de valeur monétaire, ne constituent pas un titre de propriété et ne donnent pas un droit ou un intérêt acquis.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eIrrégularités\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eDans le cas où Avantages Cartes versés grâce aux Défis Gagnants n’auraient pas été obtenus par des moyens légitimes et, plus particulièrement, en conformité avec les présentes conditions relatives aux avantages complémentaires et/ou aux conditions générales d’utilisation ci-avant, ceux-ci seraient nuls et non avenus et, par conséquent, refusés.\u003c/p\u003e\n\u003cp\u003eSi une partie des Défis gagnants est contrefaite, illisible, tronquée ou trafiquée de quelque manière que ce soit, ou si ceux-ci contiennent ou font apparaître une erreur ou une contradiction d'impression, de typographie, mécanique ou autre, ou s’ils se rapportent à une autre promotion, les Défis gagnants seront réputés nuls et non avenus.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"2c:T16ca,"])</script><script>self.__next_f.push([1,"\u003cp\u003eLa société Infinity Advertising est une régie publicitaire de médias. Infinity met à disposition sur les Supports Digitaux d’Intermarché des offres distribuées par des Marques (fabricant ou fournisseur de produits commercialisés au sein des Points de vente Intermarché) à tout porteur de la Carte de fidélité (ci-après, conjointement : « Mes offres de la semaine » ou « Offres de la semaine »).\u003c/p\u003e\u003cp\u003eCelles-ci prennent la forme de remises immédiates sur un produit (Remise Immédiate) ou sur un ou plusieurs produits composant un lot créé par le Client en achetant plusieurs références identique ou variétés de produits au sein d’une même gamme (ci-après Lots Virtuels) dans les conditions ci-après.\u003c/p\u003e\u003cp style=\"text-transform: uppercase;\"\u003e\u003cb\u003e1.1 INSCRIPTION\u003c/b\u003e\u003c/p\u003e\u003cp\u003eAfin de pouvoir consulter Mes offres de la semaine, le Client doit être titulaire d’une Carte de Fidélité et doit créer un compte en complétant le formulaire d’inscription sur les Supports Digitaux.\u003c/p\u003e\u003cp\u003eSi le Client possède déjà un compte créé sur les Supports Digitaux, il doit simplement renseigner le numéro de sa Carte de Fidélité sur ledit compte.\u003c/p\u003e\u003cp\u003eLes informations du formulaire qui ont un caractère obligatoire sont signalées par un astérisque, elles sont indispensables pour valider l’inscription du Client. Les informations facultatives qui pourraient y être demandées permettent -pour leur part- de proposer au Client des avantages et offres adaptés à ses centres d’intérêts.\u003c/p\u003e\u003cp\u003eTout formulaire d’inscription incomplet ou erroné ne sera pas pris en compte et ne permettra pas de valider définitivement l’inscription du Client.\u003c/p\u003e\u003cp\u003eÁ l’issue de son inscription, un email de confirmation d'inscription sera adressé au Client ;\u003c/p\u003e\u003cp style=\"text-transform: uppercase;\"\u003e\u003cb\u003e1.2 CARACTÉRISTIQUES ET RESTRICTIONS\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eComment obtenir Mes offres de la semaine ?\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLes Offres de la semaine sont des remises immédiates accordées par les Marques (fabricant ou fournisseur de produits commercialisés au sein des Points de vente Intermarché) via Infinity Advertising et sont effectuées sur un produit ou sur des Lots Virtuels à un segment de clients sélectionnés en fonction de leur historique d’achats réalisés dans les 12 derniers mois précédant le dernier achat sur le site, l’application Intermarché ainsi que dans tout Point de vente Intermarché participant au programme de Fidélité.\u003c/p\u003e\u003cp\u003eCes Offres de la semaine sont automatiquement disponibles sur la Carte de Fidélité du client si le Client n’a pas exercé son droit d’opposition à bénéficier des offres personnalisées.\u003c/p\u003e\u003cp\u003eVous pouvez exercer votre droit d’opposition en cliquant ici et sélectionnant l’objet « Autre » et en indiquant dans le corps de votre demande que vous vous opposez à recevoir des Offres personnalisées.\u003c/p\u003e\u003cp\u003e\u003cb\u003ePériode de validité\u003c/b\u003e\u003c/p\u003e\u003cp\u003eChacune des Offres de la semaine est valable une semaine (du lundi au dimanche) à compter de sa parution dans la limite du nombre de bons disponibles indiqués sur chaque offre. Vous pouvez prendre connaissance des modalités sur les opérations en cours.\u003c/p\u003e\u003cp\u003e\u003cb\u003eConditions de chacune des Offres de la semaine\u003c/b\u003e\u003c/p\u003e\u003cp\u003eChacune des Offres de la semaine devra être appliquée dans les conditions précisées sur celles-ci ou sur les Supports Digitaux, telles que :\u003c/p\u003e\u003cul\u003e\u003cli\u003e- la quantité d'unités du produit porteur de l’offre associée aux Offres de la semaine (par exemple, cannettes, bouteilles ou lots) à acheter,\u003c/li\u003e\u003cli\u003e- le ou les produits sur lesquels portent les Offres de la semaine devront être achetés pendant la durée de l’opération commerciale\u003c/li\u003e\u003cli\u003e- le nombre de fois où le Client peut utiliser chacune des Offres de la semaine, etc.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIl appartient au Client de prendre connaissance et d'accepter l'ensemble desdites conditions applicables à chacune des Offres de la semaine, préalablement à son utilisation.\u003c/p\u003e\u003cp\u003ePour se voir octroyer les Remises Immédiates et les Lots Virtuels associées aux Offres de la semaine, le Client devra se rendre dans le point de vente de l’enseigne \"Intermarché\" participant de son choix et acheter les produits porteurs de l’offre associée aux Offres de la semaine. Pour bénéficier des Offres de la semaine, le Client devra également présenter sa carte de fidélité lors de son passage en caisse.\u003c/p\u003e\u003cp\u003e\u003cb\u003eDisponibilité des produits\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLes produits requis à l'achat pour pouvoir utiliser les Offres de la semaine ou les produits en relation avec lesquels ils peuvent être utilisés, peuvent ne pas être disponibles à tout moment dans un point de vente participant, ce que le Client reconnaît et accepte.\u003c/p\u003e\u003cp\u003e\u003cb\u003eInterdictions\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLes Offres de la semaine ne peuvent être cédées, troquées, négociées, transférées et/ou échangées contre des espèces ou pour l'octroi d'un crédit. Elles n'ont pas de valeur monétaire, ne constituent pas un titre de propriété et ne donnent pas un droit ou un intérêt acquis.\u003c/p\u003e\u003cp\u003e\u003cb\u003eIrrégularités\u003c/b\u003e\u003c/p\u003e\u003cp\u003eDans le cas où les Offres de la semaine n’auraient pas été obtenues par des moyens légitimes et, plus particulièrement, en conformité avec les présentes conditions relatives aux avantages complémentaires et/ou aux conditions générales d’utilisation ci-avant, celles-ci seraient nulles et non avenues et, par conséquent, refusées.\u003c/p\u003e\u003cp\u003eSi une partie des Offres de la semaine est contrefaite, illisible, tronquée ou trafiquée de quelque manière que ce soit, ou si celles-ci contiennent ou font apparaitre une erreur ou une contradiction d'impression, de typographie, mécanique ou autre, ou s’ils se rapportent à une autre promotion, les Offres de la semaine seront réputées nulles et non avenues.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L23\",null,{\"cgu\":{\"meta\":{\"title\":\"Conditions générales d'utilisation\",\"description\":\"Conditions générales d'utilisation du site Intermarché\"},\"components\":[{\"type\":\"organisms\",\"name\":\"block\",\"props\":{\"type\":\"basic\",\"title\":\"Conditions générales d'utilisation de la carte de fidélité Intermarché\",\"mainTitle\":null,\"titleSecondary\":\"Mise à jour le 25/09/2025\",\"description\":null,\"maxWidth\":null,\"minHeight\":null,\"maxHeight\":null,\"theme\":null,\"cmsComponents\":[{\"type\":\"cms\",\"name\":\"summary\",\"props\":{\"links\":[{\"title\":\"1. Qu'est-ce que la carte de fidélité\",\"id\":\"3IuyEkewiOesR5ksSh32wr\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"2. Modalités d'utilisation de la carte de fidélité\",\"id\":\"3m77PthfYxLej1NhUfYYjl\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"3. Comment adhérer à la carte de fidélité\",\"id\":\"10tUic2rrNigJJT9g0lq0J\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"4. Responsabilité\",\"id\":\"56h5FruqEzibwvtQWreYV4\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"5. Divers\",\"id\":\"4qthJUKXCZeGHYddT9HYhs\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[{\"label\":\"CONDITIONS APPLICABLES AUX AVANTAGES COMPLÉMENTAIRES À LA CARTE DE FIDÉLITÉ\",\"id\":\"2A0AYp21jFWIQm6mm3i6np\",\"elementNumber\":null,\"anchor\":null}]},{\"title\":\"1. Les communautés Intermarché\",\"id\":\"6Zu7PA8Up3k27ZfHw8YmF2\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"2. Les opérations vignettes\",\"id\":\"3gExCrwFm0BHl3s6FVJIXr\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"3. « Mes défis gagnants »\",\"id\":\"3c656kKPs0EGCvs94FtaU9\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]},{\"title\":\"4. Ticket de caisse dématérialisé\",\"id\":\"1sbF1xYMysHPVMyA7im6Sh\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[{\"label\":\"CONDITIONS APPLICABLES AUX OFFRES PARTENAIRES\",\"id\":\"6wncxloJD79CFD8rIUb1Of\",\"elementNumber\":null,\"anchor\":null}]},{\"title\":\"1. Mes offres de la semaine\",\"id\":\"1P5KtnOjZUboFp8BZCYL1J\",\"elementNumber\":null,\"anchor\":null,\"subTitles\":[]}]}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"PREAMBULE\",\"content\":\"$24\",\"id\":\"5skuocj1IN0bTowdU9XNeO\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"1. Qu'est-ce que la carte de fidélité\",\"content\":\"\u003cp\u003e\\n  La Carte de Fidélité est délivrée directement par le Point de Vente au Client\\n  ou mise à disposition en ligne sur les Supports Digitaux dans sa version\\n  dématérialisée.\\n\u003c/p\u003e\\n\u003cp\u003eElle permet au Client qui en est\\n  titulaire de se voir accorder des avantages en unités équivalents euros\\n  (ci-après : le(s) « Avantage(s) Carte ») dans les points de vente participant\\n  au programme de fidélité de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;» et sur les Supports\\n  Digitaux.\u003cbr\u003e\\n\u003c/p\u003e\\n\",\"id\":\"3IuyEkewiOesR5ksSh32wr\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"2. Modalités d'utilisation de la carte de fidélité\",\"content\":\"$25\",\"id\":\"3m77PthfYxLej1NhUfYYjl\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"3. Comment adhérer à la carte de fidélité\",\"content\":\"$26\",\"id\":\"10tUic2rrNigJJT9g0lq0J\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"4. Responsabilité\",\"content\":\"$27\",\"id\":\"56h5FruqEzibwvtQWreYV4\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"5. Divers\",\"content\":\"$28\",\"id\":\"4qthJUKXCZeGHYddT9HYhs\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"CONDITIONS APPLICABLES AUX AVANTAGES COMPLÉMENTAIRES À LA CARTE DE FIDÉLITÉ\",\"content\":\"\u003cp\u003e\\n  En complément des conditions générales d’utilisation relatives à la Carte de\\n  Fidélité proposée par le Point de Vente, le Client doit avoir adhéré auxdites\\n  conditions générales d’utilisation et être titulaire d’une Carte de Fidélité\\n  active pour bénéficier d’avantages complémentaires décrits dans les présentes\\n  conditions.\\n\u003c/p\u003e\\n\u003cp\u003e\\n  Celles-ci complètent les conditions générales d’utilisation, sans les\\n  modifier. Elles en font partie intégrante.\\n\u003c/p\u003e\\n\u003cp\u003e\\n  Elles sont proposées par la société de l’enseigne «\u0026nbsp;Intermarché\u0026nbsp;», laquelle a\\n  développé et propose lesdits avantages complémentaires : ITM ALIMENTAIRE\\n  INTERNATIONAL, société par actions simplifiée au capital social de 149 184\\n  euros, inscrite au Registre du commerce et des sociétés de Paris sous le n°341\\n  192 227, dont le siège social est situé 24, rue Auguste Chabrières à Paris\\n  (75015).\\n\u003c/p\u003e\\n\",\"id\":\"2A0AYp21jFWIQm6mm3i6np\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"1. Les communautés Intermarché\",\"content\":\"$29\",\"id\":\"6Zu7PA8Up3k27ZfHw8YmF2\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"2. Les opérations vignettes\",\"content\":\"$2a\",\"id\":\"3gExCrwFm0BHl3s6FVJIXr\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"3. « Mes défis gagnants »\",\"content\":\"$2b\",\"id\":\"3c656kKPs0EGCvs94FtaU9\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"4. Ticket de caisse dématérialisé\",\"content\":\"\u003cp\u003eL’enseigne \\\"Intermarché\\\" permet également à ses Clients titulaires de la Carte de Fidélité, qui y ont consenti, de retrouver leurs tickets de caisse lors d’un achat en Point de Vente dans leur compte digital sur les Supports Digitaux.\u003c/p\u003e\\n\u003cp\u003eLes données collectées dans ce cadre sont traitées conformément à la politique données personnelles\u0026nbsp;de la carte de fidélité Intermarché. Les Clients peuvent retirer leur consentement à tout moment dans la rubrique « Mes préférences » de leur compte client.\u003c/p\u003e\\n\u003cp\u003eVous pouvez exercer votre droit d’opposition en envoyant un mail à dpointermarche@mousquetaires.com et en indiquant dans le corps de votre demande que vous vous opposez à recevoir via les Supports Digitaux les tickets de caisse dématérialisés en précisant le numéro de votre carte de fidélité.\u003c/p\u003e\",\"id\":\"1sbF1xYMysHPVMyA7im6Sh\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"CONDITIONS APPLICABLES AUX OFFRES PARTENAIRES\",\"content\":\"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\",\"id\":\"6wncxloJD79CFD8rIUb1Of\"}},{\"type\":\"cms\",\"name\":\"contentSection\",\"props\":{\"title\":\"1. Mes offres de la semaine\",\"content\":\"$2c\",\"id\":\"1P5KtnOjZUboFp8BZCYL1J\"}}],\"loginRequired\":false,\"startDateTime\":null,\"endDateTime\":null,\"eShopConditional\":null,\"anchorInSummary\":null,\"idGroup\":null}}]}}]\n"])</script><script id="datalayerInit" data-nscript="afterInteractive">window.dataLayer = window.dataLayer || [];</script><script id="gtmMainId" data-nscript="afterInteractive">
